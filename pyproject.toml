[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nvis-docs-hub"
version = "0.1.0"
description = "A local documentation catalog, reader, section search, and MCP server for NVIS - OVA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1.6,<4",
  "markdown-it-py>=3,<5",
  "bleach>=6.2,<7",
  "tinycss2>=1.4,<2",
  "pyyaml>=6,<7",
  "pydantic>=2.9,<3",
  "mcp>=1.30,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.14,<1", "mypy>=1.18,<2", "types-PyYAML>=6", "types-bleach>=6"]

[project.scripts]
nvis-hub = "nvis_hub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nvis_hub = ["templates/*.html", "templates/**/*.html", "static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src/nvis_hub"]
check_untyped_defs = true
ignore_missing_imports = true
